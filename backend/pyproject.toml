# Tooling for the backend package. Render / Alembic / uvicorn all run from backend/.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = [".venv", "venv", "__pycache__", "db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "api", "core", "db", "pipeline"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "live: hits the public internet (disabled in CI)",
]
